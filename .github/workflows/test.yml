name: CI Automation Test

on:
  push:
    branches: [ main, master, dev, alt-dev, local-setup ]
  pull_request:
    branches: [ main, master, dev, alt-dev, local-setup ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run Tests
      run: mvn -f backend/pom.xml clean test

    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          backend/target/surefire-reports/
          screenshots/
        if-no-files-found: ignore
